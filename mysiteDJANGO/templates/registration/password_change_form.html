{% extends "base.html" %}

{% block content %}
<h2>Change Your Password</h2>

{% if messages %}
    <ul class="messages">
        {% for message in messages %}
            <li{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
        {% endfor %}
    </ul>
{% endif %}

    <form method="post">
        {% csrf_token %}
        {{ password_form.as_p }}  <!-- Render password change fields -->
        <button type="submit">Change Password</button>
    </form>
    <br><br>

<!-- Return to Student Dashboard or Home -->
<div>
    <a href="{% url 'student_dashboard' %}">Return to Student Dashboard</a> |
    <a href="{% url 'home' %}">Go to Home</a>
</div>

{% endblock %}
